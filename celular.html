<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle Robótica - Firestore</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #121212;
      color: #ffffff;
      padding: 20px;
    }
    .status-card {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 20px;
      max-width: 350px;
      margin: 20px auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .comando-display {
      font-size: 3.5rem;
      font-weight: bold;
      color: #00ffcc;
      margin: 15px 0;
    }
    button {
      background-color: #00ffcc;
      color: #121212;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Controle por Inclinação</h1>

  <div class="status-card">
    <p>Comando enviado para coleção <strong>celular</strong>:</p>
    <div id="comando" class="comando-display">PARAR</div>
    <p>Inclinação Frente/Trás: <span id="beta-val">0</span>°</p>
    <p>Inclinação Lados: <span id="gamma-val">0</span>°</p>
  </div>

  <button id="btn-permissao">Conectar Sensores do Celular</button>

  <script type="module">
    // Importações do Firebase SDK v10 (CDN oficial)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Suas credenciais do projeto endereco3aelias
    const firebaseConfig = {
      apiKey: "AIzaSyDHH7SFX-Ao6a1nE8li_IYyp6BjpFrDx10",
      authDomain: "endereco3aelias.firebaseapp.com",
      projectId: "endereco3aelias",
      storageBucket: "endereco3aelias.firebasestorage.app",
      messagingSenderId: "965511939666",
      appId: "1:965511939666:web:d1a48466e9ff7ca4a0818b"
    };

    // Inicialização do Firebase e do Firestore
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let ultimoComandoEnviado = "";

    // Mapeia a inclinação do dispositivo
    function processarOrientacao(event) {
      const beta = event.beta;   // Movimento para cima/baixo
      const gamma = event.gamma; // Movimento para esquerda/direita

      if (beta === null || gamma === null) return;

      document.getElementById('beta-val').innerText = Math.round(beta);
      document.getElementById('gamma-val').innerText = Math.round(gamma);

      let comando = "PARAR";
      const LIMIAR = 15; // Ângulo mínimo (em graus) para considerar movimento

      // Lógica das direções pedidas:
      // Movimento para CIMA (inclinar celular para longe de você / frente) -> W
      // Movimento para BAIXO (inclinar celular para perto de você / trás) -> S
      // Movimento para ESQUERDA -> A
      // Movimento para DIREITA -> D
      if (beta < -LIMIAR) {
        comando = "W"; 
      } else if (beta > LIMIAR) {
        comando = "S"; 
      } else if (gamma < -LIMIAR) {
        comando = "A"; 
      } else if (gamma > LIMIAR) {
        comando = "D"; 
      }

      document.getElementById('comando').innerText = comando;

      // Envia ao Firestore apenas quando o comando muda
      if (comando !== ultimoComandoEnviado) {
        ultimoComandoEnviado = comando;
        gravarNoFirestore(comando);
      }
    }

    // Gravação no documento 'controle' dentro da coleção 'celular'
    async function gravarNoFirestore(comando) {
      try {
        await setDoc(doc(db, "celular", "controle"), {
          comando: comando,
          atualizadoEm: new Date()
        });
        console.log("Sucesso! Comando salvo na coleção 'celular':", comando);
      } catch (erro) {
        console.error("Erro ao gravar no Firestore:", erro);
      }
    }

    // Solicita autorização nos sensores (essencial para iOS)
    const btnPermissao = document.getElementById('btn-permissao');
    btnPermissao.addEventListener('click', () => {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(resposta => {
            if (resposta === 'granted') {
              window.addEventListener('deviceorientation', processarOrientacao);
              btnPermissao.style.display = 'none';
            } else {
              alert('Permissão para os sensores foi recusada.');
            }
          })
          .catch(console.error);
      } else {
        // Padrão para Android / Navegadores Desktop
        window.addEventListener('deviceorientation', processarOrientacao);
        btnPermissao.style.display = 'none';
      }
    });
  </script>
</body>
</html>
