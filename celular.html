<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle Robótica - Moto E7</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #121212;
      color: #ffffff;
      padding: 20px;
    }
    .status-card {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 20px;
      max-width: 350px;
      margin: 20px auto;
    }
    .comando-display {
      font-size: 3.5rem;
      font-weight: bold;
      color: #00ffcc;
      margin: 15px 0;
    }
    button {
      background-color: #00ffcc;
      color: #121212;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 15px;
    }
    #log {
      background: #000;
      color: #00ff00;
      font-family: monospace;
      padding: 10px;
      border-radius: 6px;
      text-align: left;
      font-size: 0.8rem;
      max-height: 150px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <h1>Controle por Inclinação</h1>

  <div class="status-card">
    <p>Comando enviando:</p>
    <div id="comando" class="comando-display">PARAR</div>
    <p>Beta (Frente/Trás): <span id="beta-val">0</span>°</p>
    <p>Gamma (Lados): <span id="gamma-val">0</span>°</p>
  </div>

  <button id="btn-permissao">Ativar Sensores do Celular</button>

  <h3>Status do Sistema:</h3>
  <div id="log">Aguardando clique no botão...</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDHH7SFX-Ao6a1nE8li_IYyp6BjpFrDx10",
      authDomain: "endereco3aelias.firebaseapp.com",
      projectId: "endereco3aelias",
      storageBucket: "endereco3aelias.firebasestorage.app",
      messagingSenderId: "965511939666",
      appId: "1:965511939666:web:d1a48466e9ff7ca4a0818b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let ultimoComandoEnviado = "";

    function logger(msg) {
      const logDiv = document.getElementById('log');
      logDiv.innerHTML += "<br>> " + msg;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    // Verifica se está rodando em HTTPS
    if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost') {
      logger("ATENÇÃO: O site não está rodando em HTTPS! Os sensores vão falhar no Android.");
    }

    function processarOrientacao(event) {
      const beta = event.beta;
      const gamma = event.gamma;

      if (beta === null || gamma === null) {
        logger("Sensor retornou valores nulos.");
        return;
      }

      document.getElementById('beta-val').innerText = Math.round(beta);
      document.getElementById('gamma-val').innerText = Math.round(gamma);

      let comando = "PARAR";
      const LIMIAR = 12; // Limiar um pouco menor para facilitar o teste no Moto E7

      if (beta < -LIMIAR) comando = "W";
      else if (beta > LIMIAR) comando = "S";
      else if (gamma < -LIMIAR) comando = "A";
      else if (gamma > LIMIAR) comando = "D";

      document.getElementById('comando').innerText = comando;

      if (comando !== ultimoComandoEnviado) {
        ultimoComandoEnviado = comando;
        gravarNoFirestore(comando);
      }
    }

    async function gravarNoFirestore(comando) {
      try {
        await setDoc(doc(db, "celular", "controle"), {
          comando: comando,
          atualizadoEm: new Date()
        });
        logger("Gravado no Firestore: " + comando);
      } catch (erro) {
        logger("ERRO no Firestore: " + erro.message);
      }
    }

    document.getElementById('btn-permissao').addEventListener('click', () => {
      logger("Botão clicado. Tentando ativar sensores...");

      if (window.DeviceOrientationEvent) {
        window.addEventListener('deviceorientation', processarOrientacao, true);
        logger("Atributo deviceorientation ativado!");
      } else {
        logger("Erro: Seu navegador não suporta DeviceOrientationEvent.");
      }
    });
  </script>
</body>
</html>
