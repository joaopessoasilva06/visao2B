<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle Robótica - 8 Gestos Ajustados</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #121212;
      color: #ffffff;
      padding: 20px;
    }
    .status-card {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 20px;
      max-width: 350px;
      margin: 20px auto;
    }
    .comando-display {
      font-size: 3.5rem;
      font-weight: bold;
      color: #00ffcc;
      margin: 15px 0;
    }
    button {
      background-color: #00ffcc;
      color: #121212;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 15px;
    }
    #log {
      background: #000;
      color: #00ff00;
      font-family: monospace;
      padding: 10px;
      border-radius: 6px;
      text-align: left;
      font-size: 0.8rem;
      max-height: 150px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <h1>Controle por Gestos (Moto E7)</h1>

  <div class="status-card">
    <p>Comando enviado:</p>
    <div id="comando" class="comando-display">PARAR</div>
    <p>X: <span id="x-val">0</span> | Y: <span id="y-val">0</span> | Z: <span id="z-val">0</span></p>
    <p>Chacoalho (Impacto): <span id="impacto-val">0</span></p>
  </div>

  <button id="btn-permissao">Conectar Sensores</button>

  <h3>Status do Sistema:</h3>
  <div id="log">Aguardando clique no botão...</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDHH7SFX-Ao6a1nE8li_IYyp6BjpFrDx10",
      authDomain: "endereco3aelias.firebaseapp.com",
      projectId: "endereco3aelias",
      storageBucket: "endereco3aelias.firebasestorage.app",
      messagingSenderId: "965511939666",
      appId: "1:965511939666:web:d1a48466e9ff7ca4a0818b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let ultimoComandoEnviado = "";

    function logger(msg) {
      const logDiv = document.getElementById('log');
      logDiv.innerHTML += "<br>> " + msg;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    function processarAcelerometro(event) {
      const accGrav = event.accelerationIncludingGravity; // Com Gravidade
      const accPura = event.acceleration;                  // Sem Gravidade (Só impacto)

      if (!accGrav || accGrav.x === null) return;

      const x = accGrav.x;
      const y = accGrav.y;
      const z = accGrav.z;

      // Medidor de chacoalho rápido (impacto puro)
      let forcaChacoalho = 0;
      if (accPura && accPura.x !== null) {
        forcaChacoalho = Math.sqrt(accPura.x ** 2 + accPura.y ** 2 + accPura.z ** 2);
      }

      document.getElementById('x-val').innerText = x.toFixed(1);
      document.getElementById('y-val').innerText = y.toFixed(1);
      document.getElementById('z-val').innerText = z.toFixed(1);
      document.getElementById('impacto-val').innerText = forcaChacoalho.toFixed(1);

      let comando = "PARAR";

      // --- VERIFICAÇÃO DOS GESTOS (MÁXIMA PRIORIDADE) ---

      // 1. GESTO Y: Chacoalhar o celular para frente/trás rápido (como se ligasse a lanterna)
      if (forcaChacoalho > 12.0) {
        comando = "Y";
      }
      // 2. GESTO X: Girar o celular (Deitar a tela totalmente de lado / Horizontal)
      else if (Math.abs(x) > 8.0 && Math.abs(y) < 3.0) {
        comando = "X";
      }
      // 3. GESTO L: Abrir o braço para a ESQUERDA (Celular plano com a tela para cima, Z alto)
      else if (x > 6.0 && z > 6.0) {
        comando = "L";
      }
      // 4. GESTO R: Abrir o braço para a DIREITA (Celular plano com a tela para cima, Z alto)
      else if (x < -6.0 && z > 6.0) {
        comando = "R";
      }
      // --- MOVIMENTOS PADRÃO (Inclinando o celular de pé: W, S, A, D) ---
      else {
        const LIMIAR = 3.5;
        if (y < -LIMIAR) comando = "S";      // Inclinar para frente
        else if (y > LIMIAR) comando = "W"; // Inclinar para trás
        else if (x < -LIMIAR) comando = "A"; // Inclinar para esquerda
        else if (x > LIMIAR) comando = "D";  // Inclinar para direita
      }

      document.getElementById('comando').innerText = comando;

      if (comando !== ultimoComandoEnviado) {
        ultimoComandoEnviado = comando;
        gravarNoFirestore(comando);
      }
    }

    async function gravarNoFirestore(comando) {
      try {
        await setDoc(doc(db, "celular", "controle"), {
          comando: comando,
          atualizadoEm: new Date()
        });
        logger("Gravado no Firestore: " + comando);
      } catch (erro) {
        logger("ERRO no Firestore: " + erro.message);
      }
    }

    document.getElementById('btn-permissao').addEventListener('click', () => {
      logger("Ativando sensores do Moto E7...");

      if ('DeviceMotionEvent' in window) {
        window.addEventListener('devicemotion', processarAcelerometro, false);
        logger("Pronto! Teste os gestos.");
      } else {
        logger("Erro: Acelerômetro não suportado.");
      }
    });
  </script>
</body>
</html>
