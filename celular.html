<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle Robótica - Moto E7 (Acelerômetro)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #121212;
      color: #ffffff;
      padding: 20px;
    }
    .status-card {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 20px;
      max-width: 350px;
      margin: 20px auto;
    }
    .comando-display {
      font-size: 3.5rem;
      font-weight: bold;
      color: #00ffcc;
      margin: 15px 0;
    }
    button {
      background-color: #00ffcc;
      color: #121212;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 15px;
    }
    #log {
      background: #000;
      color: #00ff00;
      font-family: monospace;
      padding: 10px;
      border-radius: 6px;
      text-align: left;
      font-size: 0.8rem;
      max-height: 150px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <h1>Controle por Acelerômetro</h1>

  <div class="status-card">
    <p>Comando enviado:</p>
    <div id="comando" class="comando-display">PARAR</div>
    <p>Eixo Y (Frente/Trás): <span id="y-val">0</span></p>
    <p>Eixo X (Lados): <span id="x-val">0</span></p>
  </div>

  <button id="btn-permissao">Conectar Acelerômetro</button>

  <h3>Status do Sistema:</h3>
  <div id="log">Aguardando clique no botão...</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDHH7SFX-Ao6a1nE8li_IYyp6BjpFrDx10",
      authDomain: "endereco3aelias.firebaseapp.com",
      projectId: "endereco3aelias",
      storageBucket: "endereco3aelias.firebasestorage.app",
      messagingSenderId: "965511939666",
      appId: "1:965511939666:web:d1a48466e9ff7ca4a0818b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let ultimoComandoEnviado = "";

    function logger(msg) {
      const logDiv = document.getElementById('log');
      logDiv.innerHTML += "<br>> " + msg;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    function processarAcelerometro(event) {
      // Usamos a aceleração com gravidade (funciona em todos os Androids)
      const acc = event.accelerationIncludingGravity;

      if (!acc || acc.x === null || acc.y === null) {
        return;
      }

      // x e y medem a gravidade atuando no corpo do celular (-10 a +10 aprox)
      const x = acc.x;
      const y = acc.y;

      document.getElementById('x-val').innerText = x.toFixed(1);
      document.getElementById('y-val').innerText = y.toFixed(1);

      let comando = "PARAR";
      const LIMIAR = 3.5; // Força de gravidade mínima ao tombar o celular

      // Lógica ajustada para quando você segura o celular em pé na mão:
      if (y < -LIMIAR) comando = "W";      // Inclinar para frente
      else if (y > LIMIAR) comando = "S"; // Inclinar para trás
      else if (x < -LIMIAR) comando = "D"; // Tombar para direita
      else if (x > LIMIAR) comando = "A";  // Tombar para esquerda

      document.getElementById('comando').innerText = comando;

      if (comando !== ultimoComandoEnviado) {
        ultimoComandoEnviado = comando;
        gravarNoFirestore(comando);
      }
    }

    async function gravarNoFirestore(comando) {
      try {
        await setDoc(doc(db, "celular", "controle"), {
          comando: comando,
          atualizadoEm: new Date()
        });
        logger("Gravado no Firestore: " + comando);
      } catch (erro) {
        logger("ERRO no Firestore: " + erro.message);
      }
    }

    document.getElementById('btn-permissao').addEventListener('click', () => {
      logger("Ativando Acelerômetro...");

      if ('DeviceMotionEvent' in window) {
        window.addEventListener('devicemotion', processarAcelerometro, false);
        logger("Acelerômetro ativo! Mova/Incline o celular.");
      } else {
        logger("Erro: Acelerômetro não suportado.");
      }
    });
  </script>
</body>
</html>
