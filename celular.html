<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle Robótica - 8 Gestos (Moto E7)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #121212;
      color: #ffffff;
      padding: 20px;
    }
    .status-card {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 20px;
      max-width: 350px;
      margin: 20px auto;
    }
    .comando-display {
      font-size: 3.5rem;
      font-weight: bold;
      color: #00ffcc;
      margin: 15px 0;
    }
    button {
      background-color: #00ffcc;
      color: #121212;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 15px;
    }
    #log {
      background: #000;
      color: #00ff00;
      font-family: monospace;
      padding: 10px;
      border-radius: 6px;
      text-align: left;
      font-size: 0.8rem;
      max-height: 150px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <h1>Controle por Gestos Avançados</h1>

  <div class="status-card">
    <p>Comando enviado:</p>
    <div id="comando" class="comando-display">PARAR</div>
    <p>Eixo X: <span id="x-val">0</span> | Eixo Y: <span id="y-val">0</span></p>
    <p>Eixo Z: <span id="z-val">0</span> | Força Total: <span id="forca-val">0</span></p>
  </div>

  <button id="btn-permissao">Ativar Sensores do Celular</button>

  <h3>Status do Sistema:</h3>
  <div id="log">Aguardando clique no botão...</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDHH7SFX-Ao6a1nE8li_IYyp6BjpFrDx10",
      authDomain: "endereco3aelias.firebaseapp.com",
      projectId: "endereco3aelias",
      storageBucket: "endereco3aelias.firebasestorage.app",
      messagingSenderId: "965511939666",
      appId: "1:965511939666:web:d1a48466e9ff7ca4a0818b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let ultimoComandoEnviado = "";

    function logger(msg) {
      const logDiv = document.getElementById('log');
      logDiv.innerHTML += "<br>> " + msg;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    function processarAcelerometro(event) {
      const acc = event.accelerationIncludingGravity;

      if (!acc || acc.x === null || acc.y === null || acc.z === null) {
        return;
      }

      const x = acc.x;
      const y = acc.y;
      const z = acc.z;

      // Magnitude / Força Total do movimento (Gravidade normal em repouso é ~9.8)
      const forcaTotal = Math.sqrt(x * x + y * y + z * z);

      document.getElementById('x-val').innerText = x.toFixed(1);
      document.getElementById('y-val').innerText = y.toFixed(1);
      document.getElementById('z-val').innerText = z.toFixed(1);
      document.getElementById('forca-val').innerText = forcaTotal.toFixed(1);

      let comando = "PARAR";

      // 1. GESTO Y: Chacoalhar forte o celular (Gesto Lanterna Moto)
      // Se a aceleração ultrapassar um pico forte (> 18 m/s²)
      if (forcaTotal > 18.0) {
        comando = "Y";
      } 
      // 2. GESTO X: Girar o celular em torno do seu próprio eixo (Telas na horizontal / de lado)
      // Quando o eixo Z cai quase a zero e o eixo X fica muito forte de lado
      else if (Math.abs(z) < 2.0 && Math.abs(x) > 8.5) {
        comando = "X";
      }
      // 3. GESTO L e R: Braços esticados reto nas laterais (Extensão dos braços)
      // Ao esticar o braço para a esquerda com o celular alinhado ao corpo
      else if (x < -7.0 && y < 3.0 && y > -3.0) {
        comando = "L";
      }
      // Ao esticar o braço para a direita com o celular alinhado
      else if (x > 7.0 && y < 3.0 && y > -3.0) {
        comando = "R";
      }
      // 4. MOVIMENTOS PADRÃO (Inclinando suavemente o celular W, S, A, D)
      else {
        const LIMIAR = 3.5;
        if (y < -LIMIAR) comando = "S";
        else if (y > LIMIAR) comando = "W";
        else if (x < -LIMIAR) comando = "A";
        else if (x > LIMIAR) comando = "D";
      }

      document.getElementById('comando').innerText = comando;

      if (comando !== ultimoComandoEnviado) {
        ultimoComandoEnviado = comando;
        gravarNoFirestore(comando);
      }
    }

    async function gravarNoFirestore(comando) {
      try {
        await setDoc(doc(db, "celular", "controle"), {
          comando: comando,
          atualizadoEm: new Date()
        });
        logger("Gravado no Firestore: " + comando);
      } catch (erro) {
        logger("ERRO no Firestore: " + erro.message);
      }
    }

    document.getElementById('btn-permissao').addEventListener('click', () => {
      logger("Ativando Acelerômetro com 8 Gestos...");

      if ('DeviceMotionEvent' in window) {
        window.addEventListener('devicemotion', processarAcelerometro, false);
        logger("Acelerômetro ativo! Teste os 8 movimentos.");
      } else {
        logger("Erro: Acelerômetro não suportado.");
      }
    });
  </script>
</body>
</html>
